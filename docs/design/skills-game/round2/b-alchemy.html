<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Alchemy</title>
<link rel="stylesheet" href="../../experience-refresh/round2/hud.css">
<link rel="stylesheet" href="../skills.css">
<link rel="stylesheet" href="base.css">
<style>
  /* ===== B · Skill alchemy: two skills Phill used together fuse into what came of it ===== */

  .sk-w, .sk-ai-item, .cb-item { -webkit-tap-highlight-color: transparent; } /* the glow is the feedback */

  /* the picked skill lifts; its partners breathe */
  .sk-w { transition: text-shadow .3s var(--ease), color .3s var(--ease), opacity .3s var(--ease), transform .35s var(--ease); }
  .sk-w.cb-sel { z-index: 6; opacity: 1; color: #fff; transform: translateY(-2px) scale(1.06); text-shadow: 0 0 6px hsl(290 100% 75%), 0 0 18px hsl(290 100% 65% / .8); }
  .sk-ai-item.cb-sel { border-left-color: var(--magenta); }
  .sk-ai-item.cb-sel .sk-name { text-shadow: 0 0 6px hsl(290 100% 75%), 0 0 18px hsl(290 100% 65% / .8); }
  .sk-ai-item .sk-name { transition: text-shadow .3s var(--ease), transform .35s var(--ease); transform-origin: left center; }
  .sk-ai-item.cb-sel .sk-name { transform: translateY(-1px) scale(1.04); }

  .sk-w.cb-partner, .sk-ai-item.cb-partner .sk-name { color: #fff; opacity: 1; text-shadow: 0 0 10px hsl(186 100% 70% / .85); animation: cb-breathe 1.6s ease-in-out infinite; }
  .sk-ai-item.cb-partner { border-left-color: hsl(186 100% 75% / .8); }
  .sk-w.cb-partner.cb-done, .sk-ai-item.cb-partner.cb-done .sk-name { animation: none; text-shadow: 0 0 10px hsl(130 90% 55% / .6); }
  @keyframes cb-breathe { 50% { text-shadow: 0 0 4px hsl(186 100% 70% / .5), 0 0 18px hsl(186 100% 65% / .95); } }

  /* "these have a combo" (after a skill that has none) */
  .sk-w.cb-hint, .sk-ai-item.cb-hint .sk-name { color: #fff; opacity: 1; text-shadow: 0 0 10px hsl(186 100% 70% / .7); }
  .sk-w.cb-fusing, .sk-ai-item.cb-fusing .sk-name { opacity: .25; }

  /* a wrong pair fizzles */
  .cb-fizz { animation: cb-fizz .42s var(--ease); }
  @keyframes cb-fizz { 20% { transform: translateX(-4px); } 45% { transform: translateX(3px); } 70% { transform: translateX(-2px); } }

  /* threads (the constellation): faint, drawn in, a slow flow along them */
  .cb-threads { position: absolute; z-index: 5; left: 0; top: 0; overflow: visible; pointer-events: none; transition: opacity .25s var(--ease); }
  .cb-threads.out { opacity: 0; }
  .cb-threads .base { fill: none; stroke: hsl(290 100% 80% / .32); stroke-width: 1.25; stroke-dasharray: 100; stroke-dashoffset: 100; animation: cb-draw .55s var(--ease) forwards; }
  .cb-threads .flow { fill: none; stroke: hsl(186 100% 82% / .75); stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: .6 5.4; opacity: 0; animation: cb-in .3s .45s forwards, cb-flow 1.4s linear infinite; }
  .cb-threads .node { fill: hsl(186 100% 85%); filter: drop-shadow(0 0 4px hsl(186 100% 70%)); opacity: 0; animation: cb-in .25s .45s forwards; }
  .cb-threads .done { stroke: hsl(130 90% 60% / .35); }
  .cb-threads .node.done { fill: hsl(130 90% 65%); }
  .cb-threads.pulse .base { animation: none; stroke-dashoffset: 0; stroke: hsl(290 100% 85% / .7); transition: stroke .2s; }
  @keyframes cb-draw { to { stroke-dashoffset: 0; } }
  @keyframes cb-in { to { opacity: 1; } }
  @keyframes cb-flow { to { stroke-dashoffset: -12; } }
  .rm .cb-threads .base { stroke-dashoffset: 0; }
  .rm .cb-threads .flow, .rm .cb-threads .node { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .cb-threads .base { stroke-dashoffset: 0; } .cb-threads .flow, .cb-threads .node { opacity: 1; } }

  /* the fusion: ghost words, a flash, a few sparks (Web Animations, no rAF loop) */
  .cb-fx { position: absolute; z-index: 25; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
  .cb-ghost { position: absolute; white-space: nowrap; color: #fff; text-shadow: 0 0 8px hsl(186 100% 75%), 0 0 22px hsl(290 100% 70% / .8); will-change: transform, opacity; }
  .cb-ring, .cb-core, .cb-spark { position: absolute; border-radius: 50%; will-change: transform, opacity; }
  .cb-ring { width: 20px; height: 20px; margin: -10px 0 0 -10px; border: 1.5px solid hsl(186 100% 88%); box-shadow: 0 0 12px hsl(186 100% 70%), inset 0 0 8px hsl(290 100% 75% / .7); }
  .cb-core { width: 36px; height: 36px; margin: -18px 0 0 -18px; background: radial-gradient(circle, #fff 0, hsl(186 100% 80% / .8) 30%, transparent 70%); }
  .cb-spark { width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; background: var(--c); box-shadow: 0 0 8px var(--c); }

  /* the result: the Experience section's HUD tile, as a popover by the words */
  .cb-card { position: absolute; z-index: 30; width: min(25rem, calc(100% - 32px)); padding: 1.3rem 1.4rem 1.25rem; opacity: 0; transform: translateY(8px) scale(.97); transform-origin: var(--ox, 50%) 0; transition: opacity .35s var(--ease), transform .45s var(--ease); background: linear-gradient(180deg, hsl(190 100% 75% / .08), transparent 45%), hsl(205 45% 6% / .9); }
  .cb-card.above { transform-origin: var(--ox, 50%) 100%; }
  .cb-card.in { opacity: 1; transform: none; }
  .cb-card:focus { outline: none; }
  .cb-card:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
  .cb-card .sweep { position: absolute; top: 0; left: var(--radius); right: var(--radius); height: 1px; pointer-events: none; background: linear-gradient(90deg, transparent, hsl(190 100% 88% / .95), transparent) no-repeat; background-size: 35% 100%; background-position: -60% 0; animation: cb-sweep 1.4s var(--ease) .15s 1 forwards; }
  @keyframes cb-sweep { to { background-position: 160% 0; } }
  .cb-kicker { padding-right: 2.6rem; font: 700 .74rem/1.3 var(--font-text); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
  .cb-kicker .new { color: var(--green); }
  .cb-num { display: block; margin-top: .75rem; white-space: nowrap; font: 400 clamp(2.2rem, 4.4vw, 3rem)/1 var(--font-display); letter-spacing: -.01em; color: #fff; text-shadow: 0 0 18px hsl(190 100% 70% / .35); }
  .cb-num.word { font-size: clamp(1.7rem, 3.4vw, 2.2rem); }
  .cb-label { margin-top: .5rem; font-size: .95rem; color: var(--ink-2); }
  .cb-line { margin-top: .85rem; font-weight: 600; font-size: 1.02rem; line-height: 1.45; color: var(--ink); }
  .cb-pair { margin-top: .85rem; font-size: .86rem; color: var(--cyan); opacity: .9; }
  .cb-pair .plus { margin: 0 .4em; color: var(--ink-3); }
  .cb-x { position: absolute; top: .45rem; right: .45rem; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border-radius: 50%; cursor: pointer; color: var(--ink-2); background: none; border: 0; transition: color .2s, background .2s; }
  .cb-x:hover { color: #fff; background: hsl(190 100% 75% / .08); }
  .cb-x:focus-visible { outline: 2px solid var(--cyan); outline-offset: 0; }
  .cb-x svg { width: 16px; height: 16px; }

  /* small labels by a word ("No reaction", "Pick a lit skill") */
  .cb-toast { position: absolute; z-index: 28; padding: .38rem .8rem; border-radius: 999px; white-space: nowrap; pointer-events: none; font: 700 .82rem/1.2 var(--font-text); color: #fff; background: hsl(220 30% 6% / .88); border: 1px solid hsl(290 100% 80% / .45); box-shadow: 0 6px 20px -8px hsl(290 100% 60% / .6); transform: translate(-50%, calc(-100% - 6px)); opacity: 0; transition: opacity .2s var(--ease); }
  .cb-toast.on { opacity: 1; }
  .cb-toast.cyan { border-color: hsl(186 100% 75% / .5); box-shadow: 0 6px 20px -8px hsl(186 100% 60% / .6); }

  /* the combos found, kept as content under the list */
  .cb-strip { padding-top: .25rem; }
  .cb-list { list-style: none; margin: .9rem 0 0; padding: 0; display: grid; gap: 1rem 2rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); }
  .cb-item { display: grid; gap: .15rem; width: 100%; min-height: 44px; margin: 0; padding: .2rem 0 .2rem .9rem; text-align: left; cursor: pointer; color: inherit; background: none; border: 0; border-left: 1px solid hsl(130 90% 55% / .4); border-radius: 0; transition: border-color .3s var(--ease); }
  .cb-item:hover { border-left-color: hsl(130 90% 60% / .9); }
  .cb-item:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; border-radius: 6px; }
  .cb-item-num { font: 400 1.45rem/1.1 var(--font-display); color: #fff; text-shadow: 0 0 14px hsl(190 100% 70% / .35); }
  .cb-item-name { font-weight: 700; color: var(--ink); }
  .cb-item-pair { font-size: .86rem; color: var(--ink-3); }
  .cb-item.fresh { animation: cb-fresh 1.8s var(--ease); }
  @keyframes cb-fresh { 0%, 30% { border-left-color: hsl(130 90% 65%); box-shadow: -10px 0 18px -12px hsl(130 90% 60%); } }
</style>
</head>
<body>
<p class="mock-note">Round 2 · B · Skill alchemy. It looks like the plain list. Click any skill and see what lights up. Esc lets go.</p>

<section class="section" id="skills" aria-labelledby="skills-h"></section>

<script src="../skills.js"></script>
<script src="base.js"></script>
<script src="recipes.js"></script>
<script>
(() => {
  const { mount, found, say, reducedMotion, onReducedMotion, esc } = SECTION2
  const S = mount({ title: 'Round 2 · B · Skill alchemy' })
  const root = S.root
  const RECIPES = window.RECIPES
  const counter = found({ total: RECIPES.length, label: 'combos' })
  const NS = 'http://www.w3.org/2000/svg'

  const byName = new Map(S.words.map((w) => [w.name, w]))
  const partnersOf = new Map()
  RECIPES.forEach((r, i) => {
    r.id = 'c' + i
    for (const [x, y] of [[r.a, r.b], [r.b, r.a]]) {
      if (!byName.has(x)) console.error('recipe skill not in skills.js:', x)
      if (!partnersOf.has(x)) partnersOf.set(x, [])
      partnersOf.get(x).push({ name: y, recipe: r })
    }
  })
  const recipeFor = (a, b) => (partnersOf.get(a) || []).find((p) => p.name === b)?.recipe
  const done = new Set()
  const elOf = (name) => byName.get(name).el

  /* layers: threads (SVG), fx (ghosts, flash, toasts), the combos strip */
  const svg = document.createElementNS(NS, 'svg')
  svg.classList.add('cb-threads')
  svg.setAttribute('aria-hidden', 'true')
  const fx = document.createElement('div')
  fx.className = 'cb-fx'
  fx.setAttribute('aria-hidden', 'true')
  root.append(svg, fx)
  const strip = document.createElement('div')
  strip.className = 'cb-strip'
  strip.hidden = true
  strip.innerHTML = '<h3 class="sk-h" id="cb-h">Combos</h3><ul class="cb-list" aria-labelledby="cb-h"></ul>'
  root.querySelector('#sk-list').appendChild(strip)
  const list = strip.querySelector('.cb-list')

  /* geometry, measured on demand (never inside an animation frame) */
  const textBox = (node) => { const r = document.createRange(); r.selectNodeContents(node); return r.getBoundingClientRect() }
  function box(name) {
    const w = byName.get(name), o = root.getBoundingClientRect()
    let r
    if (w.ai) {
      const a = textBox(w.el.querySelector('.sk-name')), b = textBox(w.el.querySelector('.sk-note'))
      r = { left: a.left, top: a.top, right: Math.max(a.right, b.right), bottom: b.bottom }
    } else r = w.el.getBoundingClientRect()
    const x = r.left - o.left, y = r.top - o.top, wd = r.right - r.left, h = r.bottom - r.top
    return { x, y, w: wd, h, cx: x + wd / 2, cy: y + h / 2 }
  }
  function nameBox(name) { // the word itself (the AI items' name line), for the ghosts
    const w = byName.get(name), o = root.getBoundingClientRect()
    const r = w.ai ? textBox(w.el.querySelector('.sk-name')) : w.el.getBoundingClientRect()
    const x = r.left - o.left, y = r.top - o.top
    return { x, y, w: r.width, h: r.height, cx: x + r.width / 2, cy: y + r.height / 2 }
  }
  /* where the line from b's centre toward t leaves b's box (plus a gap) */
  function edge(b, t, gap = 7) {
    const dx = t.cx - b.cx, dy = t.cy - b.cy
    if (!dx && !dy) return { x: b.cx, y: b.cy }
    const s = Math.min(dx ? (b.w / 2 + gap) / Math.abs(dx) : Infinity, dy ? (b.h / 2 + gap) / Math.abs(dy) : Infinity)
    return { x: b.cx + dx * s, y: b.cy + dy * s }
  }

  /* ---------- picking ---------- */
  let sel = null
  let firstPick = true
  function drawThreads(pulse) {
    if (!sel) return
    svg.setAttribute('width', root.offsetWidth)
    svg.setAttribute('height', root.offsetHeight)
    svg.setAttribute('viewBox', `0 0 ${root.offsetWidth} ${root.offsetHeight}`)
    const a = box(sel)
    let defs = ''
    const paths = (partnersOf.get(sel) || []).map((p, i) => {
      const b = box(p.name)
      const p0 = edge(a, b), p1 = edge(b, a)
      const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2
      const dx = p1.x - p0.x, dy = p1.y - p0.y, len = Math.hypot(dx, dy) || 1
      const bow = Math.min(90, len * 0.14)
      const cx = mx - (dy / len) * bow, cy = my + (dx / len) * bow
      const d = `M${p0.x.toFixed(1)} ${p0.y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`
      const k = done.has(p.recipe.id) ? ' done' : ''
      // a long thread shows only near its two ends, so it points rather than scratches across the list
      let fade = ''
      if (len > 380) {
        const f = Math.min(0.42, 150 / len), id = `cb-fade-${i}`
        defs += `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${p0.x}" y1="${p0.y}" x2="${p1.x}" y2="${p1.y}"><stop offset="0" stop-color="#fff"/><stop offset="${f}" stop-color="#fff" stop-opacity="0"/><stop offset="${1 - f}" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient><mask id="${id}-m" maskUnits="userSpaceOnUse" x="0" y="0" width="${root.offsetWidth}" height="${root.offsetHeight}"><rect width="100%" height="100%" fill="url(#${id})"/></mask>`
        fade = ` mask="url(#${id}-m)"`
      }
      return `<g${fade}><path class="base${k}" pathLength="100" d="${d}"/><path class="flow${k}" pathLength="100" d="${d}"/></g><circle class="node${k}" r="3" cx="${p1.x.toFixed(1)}" cy="${p1.y.toFixed(1)}"/>`
    }).join('')
    svg.innerHTML = `<defs>${defs}</defs>${paths}`
    svg.classList.remove('out')
    if (pulse) { svg.classList.add('pulse'); setTimeout(() => svg.classList.remove('pulse'), 650) }
  }
  function clearThreads() {
    svg.classList.add('out')
    const snapshot = svg.innerHTML
    setTimeout(() => { if (svg.classList.contains('out') && svg.innerHTML === snapshot) svg.innerHTML = '' }, 260)
  }
  function unmark() {
    root.querySelectorAll('.cb-sel, .cb-partner, .cb-done').forEach((e) => e.classList.remove('cb-sel', 'cb-partner', 'cb-done'))
  }
  const orList = (xs) => (xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} or ${xs[xs.length - 1]}`)

  function pick(name) {
    const ps = partnersOf.get(name) || []
    if (!ps.length) return noCombo(name)
    unmark()
    sel = name
    elOf(name).classList.add('cb-sel')
    ps.forEach((p) => elOf(p.name).classList.add('cb-partner', ...(done.has(p.recipe.id) ? ['cb-done'] : [])))
    drawThreads()
    const names = ps.map((p) => p.name)
    say(`${name} picked. It combines with ${orList(names)}. Pick ${names.length > 1 ? 'one' : 'it'} to fuse them, or press Escape.`)
    // a partner out of view (phones): say which way it is
    const rects = names.map((n) => elOf(n).getBoundingClientRect())
    const inView = rects.some((r) => r.bottom > 60 && r.top < innerHeight - 20)
    if (!inView) toast(name, rects[0].top > innerHeight ? 'Its partner is lit below ↓' : 'Its partner is lit above ↑', 'cyan', 2400)
    else if (firstPick) toast(name, 'Now pick a lit skill', 'cyan', 2200)
    firstPick = false
  }
  function cancel(announce) {
    if (!sel) return
    sel = null
    unmark()
    clearThreads()
    if (announce) say('Let go.')
  }
  function noCombo(name) {
    cancel(false)
    toast(name, 'No combo. The glowing ones have one.', 'cyan', 2000)
    const lit = [...partnersOf.keys()].map(elOf)
    lit.forEach((e) => e.classList.add('cb-hint'))
    clearTimeout(noCombo.t)
    noCombo.t = setTimeout(() => lit.forEach((e) => e.classList.remove('cb-hint')), 2400)
    const ex = [...partnersOf.keys()].filter((n) => !done.has(recipeFor(n, partnersOf.get(n)[0].name).id))
    say(`${name} has no combo. ${partnersOf.size} skills do, for example ${ex[0] || [...partnersOf.keys()][0]}.`)
  }
  function wrong(name) {
    const e = elOf(name)
    const target = byName.get(name).ai ? e.querySelector('.sk-name') : e
    if (!reducedMotion()) { target.classList.remove('cb-fizz'); void target.offsetWidth; target.classList.add('cb-fizz') }
    drawThreads(true)
    toast(name, 'No reaction', '', 1400)
    say(`${name} doesn't combine with ${sel}. Try ${orList(partnersOf.get(sel).map((p) => p.name))}.`)
  }

  /* ---------- the fusion ---------- */
  let busy = false
  function fuse(aName, bName, recipe) {
    busy = true
    const isNew = !done.has(recipe.id)
    sel = null
    clearThreads()
    const finish = () => {
      unmark()
      root.querySelectorAll('.cb-fusing').forEach((e) => e.classList.remove('cb-fusing'))
      if (isNew) { done.add(recipe.id); counter.add(recipe.id); addToStrip(recipe) }
      openCard(recipe, bName, isNew)
      busy = false
    }
    if (reducedMotion()) return finish()

    const a = nameBox(aName), b = nameBox(bName)
    const ga = ghost(aName, a), gb = ghost(bName, b)
    elOf(aName).classList.add('cb-fusing')
    elOf(bName).classList.add('cb-fusing')
    const dist = Math.hypot(b.cx - a.cx, b.cy - a.cy)
    const dur = Math.max(420, Math.min(860, 380 + dist * 0.28))
    // the first word is pulled in; the second leans toward it, then both collapse to a point
    const lean = Math.min(26, dist * 0.2) / (dist || 1)
    ga.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${b.cx - a.cx}px, ${b.cy - a.cy}px) scale(.35)`, opacity: .9 },
    ], { duration: dur, easing: 'cubic-bezier(.55,0,.8,.2)', fill: 'forwards' })
    gb.animate([
      { transform: 'translate(0,0) scale(1)' },
      { transform: `translate(${(a.cx - b.cx) * lean}px, ${(a.cy - b.cy) * lean}px) scale(1.06)`, offset: .55 },
      { transform: 'translate(0,0) scale(.35)', opacity: .9 },
    ], { duration: dur, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' })
    setTimeout(() => {
      ga.remove(); gb.remove()
      flash(b.cx, b.cy)
      setTimeout(finish, 140)
    }, dur)
  }
  function ghost(name, b) {
    const w = byName.get(name)
    const src = w.ai ? w.el.querySelector('.sk-name') : w.el
    const cs = getComputedStyle(src)
    const g = document.createElement('span')
    g.className = 'cb-ghost'
    g.textContent = name
    Object.assign(g.style, { left: b.x + 'px', top: b.y + 'px', font: cs.font, lineHeight: b.h + 'px' })
    fx.appendChild(g)
    return g
  }
  function flash(x, y) {
    const at = (el) => { el.style.left = x + 'px'; el.style.top = y + 'px'; fx.appendChild(el); return el }
    const core = at(Object.assign(document.createElement('i'), { className: 'cb-core' }))
    core.animate([{ transform: 'scale(.4)', opacity: 1 }, { transform: 'scale(2.6)', opacity: 0 }], { duration: 520, easing: 'cubic-bezier(.2,.7,.2,1)' }).onfinish = () => core.remove()
    const ring = at(Object.assign(document.createElement('i'), { className: 'cb-ring' }))
    ring.animate([{ transform: 'scale(.3)', opacity: 1 }, { transform: 'scale(5.5)', opacity: 0 }], { duration: 700, easing: 'cubic-bezier(.2,.7,.2,1)' }).onfinish = () => ring.remove()
    const colors = ['hsl(186 100% 80%)', 'hsl(290 100% 82%)', 'hsl(130 90% 62%)']
    for (let i = 0; i < 9; i++) {
      const s = at(Object.assign(document.createElement('i'), { className: 'cb-spark' }))
      s.style.setProperty('--c', colors[i % 3])
      const ang = (i / 9) * Math.PI * 2 + Math.random() * 0.5, r = 34 + Math.random() * 40
      s.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(ang) * r}px, ${Math.sin(ang) * r}px) scale(.3)`, opacity: 0 }], { duration: 520 + Math.random() * 260, easing: 'cubic-bezier(.15,.7,.3,1)' }).onfinish = () => s.remove()
    }
  }

  /* ---------- the result card ---------- */
  let card = null, cardReturn = null, cardAnchor = null
  const metricHTML = (r, cls) => `<span class="${cls}${r.metric.length > 7 ? ' word' : ''}"><span aria-hidden="true">${esc(r.metric)}</span><span class="sr-only">${esc(r.srMetric || r.metric)}</span></span>`
  function openCard(r, anchorName, isNew, anchorEl) {
    closeCard(false)
    card = document.createElement('div')
    card.className = 'cb-card hud'
    card.tabIndex = -1
    card.setAttribute('role', 'group')
    card.setAttribute('aria-labelledby', 'cb-card-t')
    card.innerHTML = `
      <span class="sweep" aria-hidden="true"></span>
      <button type="button" class="cb-x" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
      <p class="cb-kicker" id="cb-card-t">${isNew ? '<span class="new">Combo found</span> · ' : ''}${esc(r.name)}</p>
      ${metricHTML(r, 'cb-num')}
      <p class="cb-label">${esc(r.label)}</p>
      <p class="cb-line">${esc(r.line)}</p>
      <p class="cb-pair">${esc(r.a)}<span class="plus" aria-hidden="true">+</span><span class="sr-only"> and </span>${esc(r.b)}</p>`
    root.appendChild(card)
    card.querySelector('.cb-x').addEventListener('click', () => closeCard(true))
    cardReturn = anchorEl || elOf(anchorName)
    cardAnchor = () => (anchorEl ? relBox(anchorEl) : box(anchorName))
    placeCard(cardAnchor())
    requestAnimationFrame(() => card && card.classList.add('in'))
    card.focus({ preventScroll: true })
    const vr = card.getBoundingClientRect()
    if (vr.bottom > innerHeight - 8 || vr.top < 56) card.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' })
    say(`${isNew ? `Combo found, ${counter.count} of ${RECIPES.length}: ` : ''}${r.a} and ${r.b} made ${r.name}. ${r.srMetric || r.metric} ${r.label}. ${r.line}`)
  }
  function relBox(el) {
    const r = el.getBoundingClientRect(), o = root.getBoundingClientRect()
    const x = r.left - o.left, y = r.top - o.top
    return { x, y, w: r.width, h: r.height, cx: x + r.width / 2, cy: y + r.height / 2 }
  }
  function placeCard(b) {
    const W = root.clientWidth, H = root.offsetHeight, pad = 16
    const cw = card.offsetWidth, ch = card.offsetHeight
    const left = Math.max(pad, Math.min(W - cw - pad, b.cx - cw / 2))
    let top = b.y + b.h + 14
    const above = top + ch > H - 24 && b.y - 14 - ch > 0
    if (above) top = b.y - 14 - ch
    card.classList.toggle('above', above)
    card.style.left = left + 'px'
    card.style.top = top + 'px'
    card.style.setProperty('--ox', `${Math.max(10, Math.min(cw - 10, b.cx - left))}px`)
  }
  function closeCard(restoreFocus) {
    if (!card) return
    const c = card, had = c.contains(document.activeElement)
    card = null
    c.classList.remove('in')
    setTimeout(() => c.remove(), reducedMotion() ? 0 : 300)
    if (restoreFocus || had) cardReturn?.focus({ preventScroll: true })
  }

  /* ---------- the strip ---------- */
  function addToStrip(r) {
    strip.hidden = false
    const li = document.createElement('li')
    li.innerHTML = `<button type="button" class="cb-item fresh" data-combo="${r.id}">${metricHTML(r, 'cb-item-num')}<span class="cb-item-name">${esc(r.name)}</span><span class="cb-item-pair">${esc(r.a)} + ${esc(r.b)}</span></button>`
    list.appendChild(li)
    const btn = li.firstElementChild
    btn.addEventListener('click', (e) => { e.stopPropagation(); cancel(false); openCard(r, r.b, false, btn) })
    setTimeout(() => btn.classList.remove('fresh'), 1900)
  }

  /* ---------- toasts ---------- */
  function toast(name, text, cls, ms) {
    const b = box(name)
    const t = document.createElement('div')
    t.className = `cb-toast ${cls}`
    t.textContent = text
    t.style.top = b.y + 'px'
    fx.appendChild(t)
    const half = t.offsetWidth / 2 + 8, o = root.getBoundingClientRect()
    const lo = half - o.left, hi = innerWidth - o.left - half // keep it on screen
    t.style.left = Math.max(lo, Math.min(hi, byName.get(name).ai ? b.x + half - 8 : b.cx)) + 'px'
    requestAnimationFrame(() => t.classList.add('on'))
    setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 250) }, ms)
  }

  /* ---------- input ---------- */
  S.words.forEach((w) => w.el.addEventListener('click', () => {
    if (busy) return
    if (card) closeCard(false)
    if (!sel) return pick(w.name)
    if (sel === w.name) return cancel(true)
    const r = recipeFor(sel, w.name)
    if (r) return fuse(sel, w.name, r)
    wrong(w.name)
  }))
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return
    if (card) { closeCard(true); e.preventDefault() }
    else if (sel) { const back = elOf(sel); cancel(true); back.focus({ preventScroll: true }); e.preventDefault() }
  })
  // a tap or click elsewhere lets go (click, not pointerdown: a touch that scrolls mustn't)
  document.addEventListener('click', (e) => {
    if (busy) return
    const t = e.target
    if (t.closest('[data-skill], .cb-item')) return
    if (card && !card.contains(t)) closeCard(false)
    if (sel) cancel(false)
  })
  let rt = 0, lastW = innerWidth
  addEventListener('resize', () => {
    clearTimeout(rt)
    rt = setTimeout(() => {
      if (innerWidth === lastW) return // a phone's URL bar showing or hiding
      lastW = innerWidth
      if (sel) drawThreads()
      if (card) placeCard(cardAnchor())
    }, 140)
  })
  // leaving the section lets go (nothing animates offscreen)
  new IntersectionObserver(([en]) => { if (!en.isIntersecting) { cancel(false); closeCard(false) } }).observe(root)
  onReducedMotion(() => { if (sel) drawThreads() })

  window.__alchemy = { pick, fuse: (a, b) => fuse(a, b, recipeFor(a, b)), recipes: RECIPES, done }
})()
</script>
</body>
</html>
