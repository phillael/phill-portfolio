<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Synth</title>
<link rel="stylesheet" href="../../experience-refresh/round2/hud.css">
<link rel="stylesheet" href="../skills.css">
<link rel="stylesheet" href="base.css">
<style>
  /* ===== D · Skill synth: every skill is a key ===== */

  /* the string under a struck word (a bowed line that vibrates, then fades); hidden at rest */
  .syn-str { position: absolute; left: 0; right: 0; top: calc(50% + .5em); height: 10px; pointer-events: none; opacity: 0; color: hsl(var(--g, 190 100% 72%)); }
  .syn-str svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 4px currentColor) drop-shadow(0 0 1px currentColor); }
  /* the AI panel's strings are the vertical hairlines at each skill's left edge */
  .sk-ai-item .syn-str { left: -7.5px; right: auto; top: 4px; bottom: 4px; width: 14px; height: auto; }
  .sk-ai-item .sk-name { display: block; width: max-content; max-width: 100%; }

  /* the Music line, played in order so far (and after the riff) */
  .sk-group.music .sk-w.lit { color: #fff; text-shadow: 0 0 8px hsl(290 100% 75% / .9), 0 0 20px hsl(290 100% 65% / .5); }
  .rmx .sk-group.music .sk-w.next { text-decoration: underline dotted hsl(290 100% 80% / .8); text-underline-offset: 6px; }

  /* the hint: shows up under Music & more after a few notes */
  .syn-hint { margin-top: .4rem; font-size: .9rem; line-height: 1.4; color: hsl(295 60% 84%); opacity: 0; transition: opacity 1.2s var(--ease); }
  .syn-hint.on { opacity: 1; }

  /* the riff card, under the Music line once it's played left to right */
  .syn-card {
    margin-top: 1rem; padding: .9rem 1.1rem 1rem; border-radius: 16px; max-width: 22rem;
    background: linear-gradient(180deg, hsl(290 100% 75% / .1), hsl(290 100% 70% / .03)), hsl(220 30% 6% / .6);
    border: 1px solid hsl(290 100% 80% / .4); box-shadow: 0 0 30px -10px hsl(290 100% 65% / .6);
    animation: syn-in .6s var(--ease) both;
  }
  .syn-card .k { font: 700 .74rem/1 var(--font-text); letter-spacing: .2em; text-transform: uppercase; color: var(--magenta); }
  .syn-card p + p { margin-top: .45rem; }
  .syn-card .t { color: var(--ink); font-size: .98rem; line-height: 1.45; }
  .syn-card .row { margin-top: .8rem; display: flex; gap: .6rem; flex-wrap: wrap; }
  .syn-card .hbtn { --c: 290 100% 80%; }
  @keyframes syn-in { from { opacity: 0; transform: translateY(6px); } }

  /* the synth's readout: appears after the first note, rides the bottom-left of the screen */
  .syn-hud {
    position: sticky; z-index: 20; bottom: 16px; width: max-content; max-width: calc(100% - 76px); margin: 2.5rem auto 0 0;
    display: flex; align-items: center; gap: .75rem; padding: 4px 1rem 4px 4px; border-radius: 999px;
    font: 700 .8rem/1.2 var(--font-text); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2);
    background: hsl(220 30% 5% / .92); border: 1px solid var(--hair-strong);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px -12px hsl(190 100% 50% / .35);
    opacity: 0; transform: translateY(8px); transition: opacity .4s var(--ease), transform .4s var(--ease); visibility: hidden;
  }
  .syn-hud.on { opacity: 1; transform: none; visibility: visible; }
  .syn-hud b { color: #fff; letter-spacing: .06em; }
  .syn-hud .now { display: inline-flex; gap: .45rem; align-items: baseline; min-width: 6.5rem; }
  .syn-hud .now i { font-style: normal; color: hsl(var(--g, 190 100% 72%)); letter-spacing: .04em; font-feature-settings: 'tnum' 1; }
  .syn-hud .sep { width: 1px; height: 1.1rem; background: var(--hair-strong); }
  .syn-mute {
    display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; color: var(--cyan);
    background: hsl(190 100% 75% / .08); border: 1px solid hsl(190 100% 75% / .35); transition: border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .syn-mute:hover { border-color: var(--cyan); box-shadow: 0 0 16px -2px hsl(190 100% 70% / .6); }
  .syn-mute:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 50%; }
  .syn-mute svg { width: 20px; height: 20px; }
  .syn-mute .off, .syn-mute[aria-pressed="true"] .on { display: none; }
  .syn-mute[aria-pressed="true"] .off { display: block; }
  .syn-mute[aria-pressed="true"] { color: var(--ink-3); }
  .syn-hud > * { white-space: nowrap; }
  @media (max-width: 480px) {
    .syn-hud { gap: .5rem; padding-right: .85rem; font-size: .72rem; letter-spacing: .05em; max-width: calc(100% - 56px); }
    .syn-hud .now { min-width: 3.4rem; }
    .syn-hud .now i { display: none; }
  }

  /* ===== mockup only: a stand-in for the site's one music player (MusicFAB, bottom right) ===== */
  .sp { position: fixed; z-index: 50; right: 16px; bottom: 16px; display: flex; align-items: center; gap: .6rem; }
  @media (min-width: 768px) { .sp { right: 24px; bottom: 24px; } }
  .sp-fab {
    display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; color: var(--cyan);
    background: hsl(220 30% 6%); border: 2px solid hsl(190 100% 75% / .5); box-shadow: 0 0 8px hsl(190 100% 70% / .4), 0 0 16px hsl(190 100% 70% / .2);
  }
  @media (min-width: 768px) { .sp-fab { width: 56px; height: 56px; } }
  .sp-fab svg { width: 22px; height: 22px; }
  .sp-fab:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 50%; }
  .sp.playing .sp-fab { box-shadow: 0 0 15px hsl(190 100% 60%), 0 0 30px hsl(190 100% 60% / .5); }
  .sp-title {
    padding: .45rem .8rem; border-radius: 999px; font: 700 .82rem/1.2 var(--font-text); color: var(--ink); white-space: nowrap;
    background: hsl(220 30% 5% / .85); border: 1px solid hsl(190 100% 75% / .35); opacity: 0; transform: translateX(8px);
    transition: opacity .35s var(--ease), transform .35s var(--ease); pointer-events: none;
  }
  .sp.playing .sp-title { opacity: 1; transform: none; }
  .sp-stub { position: absolute; right: 0; bottom: calc(100% + 6px); font: 600 .68rem/1 var(--font-text); color: hsl(42 100% 70%); white-space: nowrap; }
  @media (max-width: 480px) { .sp-title { max-width: 9rem; overflow: hidden; text-overflow: ellipsis; } .sp-stub, .sp-title { display: none; } }
</style>
</head>
<body>
<p class="mock-note">Round 2 · D · Skill synth. Every skill is a key and every group its own instrument. Click any skill; nothing makes a sound until you do. The ♫ at the bottom right stands in for the site's music player.</p>

<section class="section" id="skills" aria-labelledby="skills-h"></section>

<!-- mockup only: the stand-in for the site's one player (its single <audio>) -->
<div class="sp" id="sp">
  <span class="sp-stub">site player (stand-in)</span>
  <span class="sp-title" id="sp-title" aria-hidden="true"></span>
  <button type="button" class="sp-fab" id="sp-fab" aria-label="Play music">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </button>
  <audio id="sp-audio" preload="none"></audio>
</div>

<script src="../skills.js"></script>
<script src="base.js"></script>
<script src="d-synth.js"></script>
</body>
</html>
